<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="talon — a firm grip on your mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="1" stop-color="#15151D"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="210" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E5CE6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#FF8AA0"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30D158"/>
      <stop offset="1" stop-color="#9CF5B0"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#7AD7FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g transform="translate(70 0)">
  <circle cx="300" cy="210" r="260" fill="url(#glow)"/>

  <!-- rings: track + value (starts at 12 o'clock) -->
  <g fill="none" stroke-width="20" stroke-linecap="round" transform="rotate(-90 300 210)">
    <circle cx="300" cy="210" r="120" stroke="#FF375F" stroke-opacity="0.16"/>
    <circle cx="300" cy="210" r="120" stroke="url(#mem)" stroke-dasharray="542.9 754"/>
    <circle cx="300" cy="210" r="92" stroke="#30D158" stroke-opacity="0.16"/>
    <circle cx="300" cy="210" r="92" stroke="url(#cpu)" stroke-dasharray="335.3 578.1"/>
    <circle cx="300" cy="210" r="64" stroke="#0A84FF" stroke-opacity="0.16"/>
    <circle cx="300" cy="210" r="64" stroke="url(#heat)" stroke-dasharray="337.8 402.2"/>
  </g>

  <!-- ceilings: a notch on each ring the value never crosses -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.92">
    <line x1="197.3" y1="176.6" x2="174.5" y2="169.2"/>
    <line x1="223.9" y1="234.7" x2="201.1" y2="242.1"/>
    <line x1="274.9" y1="164.4" x2="263.4" y2="143.4"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Inter, Arial, sans-serif">
    <text x="520" y="138" fill="#8E8E93" font-size="15" font-weight="600" letter-spacing="3.2">PERSONAL CONTROL PANEL · M5 MACBOOK AIR</text>
    <text x="514" y="250" fill="#F5F5F7" font-size="136" font-weight="600" letter-spacing="-5">talon</text>
    <text x="520" y="300" fill="#A1A1A6" font-size="30" font-weight="400" letter-spacing="-0.3">a firm grip on your mac.</text>
  </g>
  </g>
</svg>
